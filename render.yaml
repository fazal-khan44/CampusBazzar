services:
  # 1. Backend API & Live Socket.IO Web Service
  - type: web
    name: campusbazzar-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Brevo API Key (Recommended: 300 free emails/day to any recipient without domain verification)
      - key: BREVO_API_KEY
        sync: false
      # Resend API key for production email delivery (get free key at https://resend.com)
      - key: RESEND_API_KEY
        sync: false
      # Sender address (use "CampusBazzar <onboarding@resend.dev>" for free tier)
      - key: EMAIL_FROM
        value: "CampusBazzar <onboarding@resend.dev>"
      # Gmail SMTP fallback (optional, only if not using Resend)
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # URLs for email links
      - key: FRONTEND_URL
        value: https://campusbazzar-1.onrender.com
      - key: BACKEND_URL
        value: https://campusbazzar.onrender.com

  # 2. Frontend React / Vite Static Site
  - type: web
    name: campusbazzar-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campusbazzar.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
