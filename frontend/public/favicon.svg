<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    CampusBazzar Logo SVG Favicon
    Navy Blue: #1E2A3A | Orange: #F27A1A
    Shape: Shopping bag (trapezoid body, arch handle) with two crossed arrows
  -->

  <!-- === BAG BODY === -->
  <!-- Full trapezoid bag: wide top ~(8,30)-(92,30), narrowing to (18,96)-(82,96) -->
  <polygon points="8,30 92,30 82,96 18,96" fill="#1E2A3A"/>

  <!-- Arch cutout (the open top of the bag where handle inserts) -->
  <!-- White arch to simulate the opening -->
  <path d="M 30,32 Q 30,18 50,18 Q 70,18 70,32 Z" fill="white"/>

  <!-- Inner shadow / depth fold lines on bag sides (darker navy) -->
  <polygon points="8,30 22,30 20,96 18,96" fill="#16212e"/>
  <polygon points="78,30 92,30 82,96 80,96" fill="#16212e"/>

  <!-- === HANDLE === -->
  <!-- Handle arch: arc from (28,30) over top to (72,30) -->
  <path d="M 28,32 C 28,6 72,6 72,32"
        fill="none" stroke="#1E2A3A" stroke-width="8" stroke-linecap="round"/>
  <!-- Orange accent tabs on each side of handle base -->
  <rect x="23" y="22" width="9" height="13" rx="3" fill="#F27A1A"/>
  <rect x="68" y="22" width="9" height="13" rx="3" fill="#F27A1A"/>

  <!-- === CROSSED ARROWS === -->
  <!-- Arrow 1: lower-left → upper-right (↗), main orange #F27A1A -->
  <!-- Shaft -->
  <polygon points="13,90 20,96 68,46 61,40" fill="#F27A1A"/>
  <!-- Arrowhead (pointing upper-right) -->
  <polygon points="62,32 76,38 71,47 61,43 57,50 50,43 60,40" fill="#F27A1A"/>

  <!-- Arrow 2: lower-right → upper-left (↖), darker orange for depth #D06B10 -->
  <!-- Shaft -->
  <polygon points="87,90 80,96 32,46 39,40" fill="#D06B10"/>
  <!-- Arrowhead (pointing upper-left) -->
  <polygon points="38,32 24,38 29,47 39,43 43,50 50,43 40,40" fill="#D06B10"/>

  <!-- Bag bottom strip (overlay to neaten arrow overflow at bottom) -->
  <rect x="18" y="90" width="64" height="6" fill="#1E2A3A" rx="2"/>
</svg>
